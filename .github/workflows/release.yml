name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Verify composite action unchanged path
        id: release-unchanged
        uses: ./
        with:
          operation: diff
          baseline: tests/fixtures/action/baseline.json
          current: tests/fixtures/action/current.json
      - name: Assert composite action outputs
        env:
          AHP_STATUS: ${{ steps.release-unchanged.outputs.status }}
          AHP_PROVIDER: ${{ steps.release-unchanged.outputs.provider }}
          AHP_MODE: ${{ steps.release-unchanged.outputs.mode }}
          AHP_RUNTIME: ${{ steps.release-unchanged.outputs.runtime_version }}
          AHP_CHANGES: ${{ steps.release-unchanged.outputs.changes }}
        shell: bash
        run: |
          test "$AHP_STATUS" = "UNCHANGED"
          test "$AHP_PROVIDER" = "codex"
          test "$AHP_MODE" = "exec"
          test "$AHP_RUNTIME" = "codex-cli 0.154.0"
          test "$AHP_CHANGES" = "0"
      - name: Verify composite action regression path
        id: release-regression
        continue-on-error: true
        uses: ./
        with:
          operation: diff
          baseline: tests/fixtures/action/baseline.json
          current: tests/fixtures/action/regression.json
      - name: Assert composite action regression failure
        env:
          REGRESSION_OUTCOME: ${{ steps.release-regression.outcome }}
        shell: bash
        run: test "$REGRESSION_OUTCOME" = "failure"
      - run: uv build
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from agent_hook_probe import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
