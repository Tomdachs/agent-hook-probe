name: Agent Hook Probe
description: Verify coding-agent hooks or compare privacy-minimized regression snapshots.
author: Tomdachs

inputs:
  operation:
    description: "probe to run a provider, or diff to compare two saved snapshots"
    required: false
    default: probe
  provider:
    description: "Provider for probe mode: codex, antigravity, or claude"
    required: false
    default: codex
  surface:
    description: "Codex surface for probe mode: exec or tui"
    required: false
    default: exec
  baseline:
    description: "Optional baseline snapshot path for live comparison; required in diff mode"
    required: false
    default: ""
  current:
    description: "Current snapshot path; required in diff mode"
    required: false
    default: ""
  save_snapshot:
    description: "Optional path to save the live privacy-minimized snapshot"
    required: false
    default: ""
  overwrite_snapshot:
    description: "Set true to replace an existing save_snapshot file"
    required: false
    default: "false"
  model:
    description: "Optional provider model override for probe mode"
    required: false
    default: ""
  timeout:
    description: "Provider probe timeout in seconds"
    required: false
    default: "180"
  json:
    description: "Set true to emit JSON output"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: '0.12.5'
        enable-cache: true
    - name: Run Agent Hook Probe
      shell: bash
      env:
        AHP_ACTION_PATH: ${{ github.action_path }}
        AHP_OPERATION: ${{ inputs.operation }}
        AHP_PROVIDER: ${{ inputs.provider }}
        AHP_SURFACE: ${{ inputs.surface }}
        AHP_BASELINE: ${{ inputs.baseline }}
        AHP_CURRENT: ${{ inputs.current }}
        AHP_SAVE_SNAPSHOT: ${{ inputs.save_snapshot }}
        AHP_OVERWRITE_SNAPSHOT: ${{ inputs.overwrite_snapshot }}
        AHP_MODEL: ${{ inputs.model }}
        AHP_TIMEOUT: ${{ inputs.timeout }}
        AHP_JSON: ${{ inputs.json }}
      run: uv run --no-project --python 3.11 "$AHP_ACTION_PATH/scripts/github_action.py"

branding:
  icon: check-circle
  color: green
